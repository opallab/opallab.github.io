# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: "WatCL Lab"
email: "kimon.fountoulakis@uwaterloo.ca"
description: > # this means to ignore newlines until "baseurl:"
  The Waterloo Computational Learning (WatCL) Lab at the Cheriton School of Computer Science, 
  University of Waterloo. We work on machine learning and artificial intelligence models for reasoning 
  and graph-structured data.

url: "https://watcl.ca"
baseurl: ""

# Author information
author:
  name: "Kimon Fountoulakis"
  email: "kimon.fountoulakis@uwaterloo.ca"
  bio: "Associate Professor, Cheriton School of Computer Science"
  location: "University of Waterloo"
  links:
    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://github.com/watcl-lab"
    - label: "YouTube"
      icon: "fab fa-youtube"
      url: "https://www.youtube.com/channel/UCfFSCwDsARA-BCHx6Hlm07Q"

# Social media
social:
  - name: "GitHub"
    url: "https://github.com/watcl-lab"
  - name: "YouTube"
    url: "https://www.youtube.com/channel/UCfFSCwDsARA-BCHx6Hlm07Q"

include:
  - .htaccess
  - _pages

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Collections
collections:
  publications:
    output: true
    permalink: /publications/:title/

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true # default for kramdown is false. This will enable using Markdown links

# Defaults
defaults:
  - scope:
      path: ""
      type: "publications"
    values:
      layout: "publication"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

